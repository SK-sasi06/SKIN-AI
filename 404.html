<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ALSKINCARE AI</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect: converts direct path into hash route for index.html
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#/' +
        path + (l.search ? '?' + l.search.slice(1) : '') + l.hash
      );
    </script>
  </head>
  <body>
    Redirecting to ALSKINCARE AI...
  </body>
</html>
